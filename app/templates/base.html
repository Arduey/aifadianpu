<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}爱发电铺 · 虚拟商品自助销售平台{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css?v=12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23F95D1F'/%3E%3Cpath d='M13 4 6 13h5l-1 7 7-9h-5l1-7z' fill='%23fff'/%3E%3C/svg%3E">
{% block style %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
<script src="/static/app.js?v=9"></script>
<script type="module" src="/static/morphicons/morph-icons.js?v=5"></script>
{% block script %}{% endblock %}
<script>
/* 输入框一律禁用历史记录(生产规范) */
(function(){
  function off(){ document.querySelectorAll('input, textarea').forEach(function(el){ el.setAttribute('autocomplete','off'); }); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', off);
  else off();
})();
/* 密码输入框:英文输入态,避免拼音/中文形成(非 ASCII 打印字符即剔除) */
(function(){
  function pw(){
    document.querySelectorAll('input[type=password]').forEach(function(el){
      el.setAttribute('autocapitalize','off');
      el.setAttribute('autocorrect','off');
      el.setAttribute('spellcheck','false');
      el.style.imeMode = 'disabled';
      el.style.setProperty('ime-mode','disabled');
      el.addEventListener('input', function(){ el.value = el.value.replace(/[^\x20-\x7E]/g,''); });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', pw);
  else pw();
})();
</script>
</body>
</html>
