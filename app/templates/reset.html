{% extends "base.html" %}
{% block title %}重置密码 · 爱发电铺{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px">
  <div style="width:100%;max-width:400px">
    <a href="/" style="display:flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:700;margin-bottom:20px">
      <span class="logo-box" style="width:36px;height:36px"><morph-icon data-name="zap" size="17"></morph-icon></span> 爱发电铺
    </a>
    <div class="card fade-up" style="padding:24px">
      {% if done %}
      <div style="text-align:center;padding:16px 0">
        <div style="width:56px;height:56px;border-radius:50%;background:var(--good-100);color:var(--good);display:flex;align-items:center;justify-content:center;margin:0 auto 12px"><morph-icon data-name="check" size="24"></morph-icon></div>
        <div style="font-weight:700">重置成功,已自动登录</div>
        <p class="muted" style="margin:6px 0 14px">正在跳转控制台…</p>
        <a class="btn btn-primary btn-block" href="/console/dashboard">立即进入数据预览</a>
      </div>
      <script>setTimeout(() => location.href = '/console/dashboard', 900);</script>
      {% else %}
      <div style="font-size:17px;font-weight:700;margin-bottom:4px"><morph-icon data-name="key" size="15"></morph-icon> 设置新密码</div>
      <p class="muted" style="margin-bottom:16px">仅需输入新密码;提交成功后 <b>直接进入已登录状态</b>。</p>
      <form method="post">
        <div class="field">
          <label>新密码(至少 8 位)</label>
          <input name="password" type="password" required autofocus>
        </div>
        <div class="field">
          <label>确认新密码</label>
          <input name="confirm" type="password" required>
          {% if error %}<div class="field-error">{{ error }}</div>{% endif %}
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">提交并登录</button>
      </form>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
